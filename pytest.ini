[pytest]
# Pytest configuration for Playable Ads Generator

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    ui: UI component tests
    slow: Slow running tests
    asyncio: Async tests

# Asyncio mode
asyncio_mode = auto

# Coverage options (if pytest-cov installed)
# Uncomment to enable coverage reporting
# --cov=playable_agents
# --cov=models
# --cov=tools
# --cov-report=html
# --cov-report=term-missing
